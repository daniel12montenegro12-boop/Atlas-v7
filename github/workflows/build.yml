name: Compilar APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK de depuração
        shell: bash
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Mostrar erro no resumo
        if: failure()
        shell: bash
        run: |
          {
            echo '## Erro da compilação'
            echo
            (grep -E '^e: |What went wrong' -A4 build.log || true) | head -80 | sed 's/^/    /'
            echo
            echo '## Fim do log'
            echo
            tail -n 40 build.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
